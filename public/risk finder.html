<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Finder - CoverageQuest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
    <body class="no-scroll-page"> 
    <header class="dashboard-header">
        <h1 class="logo" id="logo-link" style="cursor: pointer;">Coverage Quest</a></h1>
        <div class="header-controls">
        <div class="timer-box" id="timer-box">
                <i class="fa-solid fa-stopwatch"></i> <span id="timer">60</span>s
                <div class="time-bar">
                    <div class="time-fill" id="time-fill"></div>
                </div>
        </div>
            <button id="pause-btn" class="pause-btn" style="display: inline-flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-pause"></i>
            </button>
           <button id="home-btn" class="home-btn" style="display: inline-flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-house"></i>
            </button>
    </header>

    <main class="game-screen">
        <div class="main-layout">
            <div id="wrapper">
                <img id="risk-image" alt="Safety Scene">
            </div>
            <aside class="sidebar">
                <div class="dash-card">
                    <h3 style="color: #64748b;">Total Points</h3>
                    <span class="stat-value" id="score-count">0</span>
                </div>
                <div class="dash-card">
                    <h3 style="color: #64748b;">Chances</h3>
                    <span class="stat-value" id="risk-count">3</span>
                    <p id="message">Locate the hazard...</p>
                </div>
            </aside>
        </div>
    </main>

    <div id="game-over-modal" class="modal-overlay">
    <div class="login-card">
        <h1 class="logo">Game Over</h1>
        <p class="user-email">All chances used!</p>
        
        <div class="dash-card" style="box-shadow: none; border: none;">
            <span class="level-badge">Final Score</span>
            <div class="stat-value pulse" id="final-score">0</div>
        </div>

        <button onclick="window.location.href='dashboard.html'" class="submit-btn">
            Back to Home
        </button>
    </div>
    </div>

    <script src="js/Risk_Finder.js"></script>
    <script src="https://kit.fontawesome.com/9f78b93a41.js" crossorigin="anonymous"></script>

</body>
</html>
