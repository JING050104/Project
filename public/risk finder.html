<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Finder - CoverageQuest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<style>
    .dash-card {
        box-shadow: none !important;
        border: none !important;
    }
</style>

<body class="no-scroll-page">
    <header class="dashboard-header">
        <h1 class="logo" id="logo-link" style="cursor: pointer;">Coverage Quest</h1>

        <div class="header-controls" style="display: flex; align-items: center; gap: 10px;">
            <div class="hud-item" style="display: flex; align-items: center; gap: 5px; color: white;">
                <i class="fa-solid fa-clock" style="color: #000000;"></i>
                <span id="time-spent">0s</span>
            </div>
            <button id="tutorial-btn" class="settings-btn" title="How to Play">
                <i class="fa-solid fa-circle-question"></i>
            </button>

            <div class="settings-container" style="position: relative; display: inline-block;">
                <button id="settings-toggle-btn" class="settings-btn">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <div id="settings-menu" class="settings-menu" style="display: none;">
                    <button id="pause-btn" class="menu-item">
                        <i class="fa-solid fa-pause"></i> <span id="pause-text">Pause Game</span>
                    </button>
                    <button id="home-btn" class="menu-item" onclick="confirmAndExit()">
                        <i class="fa-solid fa-house"></i> <span>Back Home</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="tutorial-modal" class="modal-overlay" style="display: none; z-index: 2000;">
        <div class="login-card" style="max-width: 400px; text-align: left;">
            <h1 class="logo">How to Play</h1>
            <div id="tutorial-content" style="color: #94a3b8; font-size: 0.9rem; line-height: 1.6; margin: 15px 0;">
            </div>
            <div
                style="margin-bottom: 15px; color: #475569; font-size: 0.8rem; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="dont-show-again-finder" style="width: 16px; height: 16px; cursor: pointer;">
                <label for="dont-show-again-finder" style="cursor: pointer;margin-top: -12px;">Don't show again this session</label>
            </div>
            <button id="close-tutorial" class="submit-btn">Got it!</button>
        </div>
    </div>

    <main class="game-screen">
        <div class="main-layout" style="display: flex; flex-direction: column; align-items: center;">

            <div id="wrapper">
                <img id="risk-image" alt="Safety Scene">

                <div class="points-overlay">
                    <i class="fa-solid fa-coins" style="color: #f1c40f;"></i>
                    <span id="score-count" class="overlay-value">0</span>
                </div>


                <div class="hearts-overlay">
                    <div id="hearts-container"></div>
                </div>
            </div>

            <div class="message-container" style="width: 100%; max-width: 800px; padding: 10px;">
                <p id="message"
                    style="text-align: center; font-weight: bold; color: #475569; font-size: 1.1rem; margin: 0;"></p>
            </div>

        </div>
    </main>

    <div id="game-over-modal" class="modal-overlay">
        <div class="login-card">
            <h1 class="logo">Game Over</h1>
            <p class="user-email" id="game-feedback-text">Session Completed!</p>
            <div class="dash-card" style="box-shadow: none; border: none;">
                <span class="level-badge">Final Score</span>
                <div class="stat-value" id="final-score">0</div>
            </div>

            <div class="dash-card" style="box-shadow: none; border: none;">
                <span class="level-badge">Levels Cleared</span>
                <div class="stat-value" id="final-level">0</div>
            </div>

            <div class="dash-card" style="box-shadow: none; border: none;">
                <span class="level-badge">Time Survived</span>
                <span class="stat-value" id="final-time-display">0s</span>
            </div>

            <button onclick="window.location.href='dashboard.html'" class="submit-btn">
                Back to Home
            </button>
        </div>
    </div>

    <script src="js/Risk_Finder.js"></script>
    <script src="https://kit.fontawesome.com/9f78b93a41.js" crossorigin="anonymous"></script>

</body>

</html>
