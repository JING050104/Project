<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Defender - CoverageQuest</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="no-scroll-page">
    <header class="dashboard-header">
        <h1 class="logo" id="logo-link" style="cursor: pointer;">Coverage Quest</h1>

        <div class="header-controls" style="display: flex; align-items: center; gap: 15px;">
            <button id="tutorial-btn" class="settings-btn" title="How to Play">
                <i class="fa-solid fa-circle-question"></i>
            </button>

            <div class="settings-container">
                <button id="settings-toggle-btn" class="settings-btn">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <div id="settings-menu" class="settings-menu" style="display: none;">
                    <button id="pause-btn" class="menu-item">
                        <i class="fa-solid fa-pause"></i> <span>Pause Game</span>
                    </button>
                    <button id="home-btn" class="menu-item" onclick="confirmAndExit()">
                        <i class="fa-solid fa-house"></i> <span>Back Home</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="tutorial-modal" class="modal-overlay" style="display: none; z-index: 2000;">
        <div class="login-card" style="max-width: 400px; text-align: left;">
            <h1 class="logo">How to Play</h1>
            <div id="tutorial-content" style="color: #94a3b8; font-size: 0.9rem; line-height: 1.6; margin: 15px 0;">
            </div>
            <div
                style="margin-bottom: 15px; color: #94a3b8; font-size: 0.8rem; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="dont-show-again" style="width: 16px; height: 16px; cursor: pointer;">
                <label for="dont-show-again" style="cursor: pointer;margin-top: -12px;">Don't show again this session</label>
            </div>
            <button id="close-tutorial" class="submit-btn">Got it!</button>
        </div>
    </div>

    <main class="game-screen">
        <div class="game-hud">
            <div class="hud-item">
                <i class="fa-solid fa-heart" style="color: #e74c3c;"></i><span id="hud-hp">100</span>
            </div>
            <div class="hud-item">
                <i class="fa-solid fa-coins" style="color: #f1c40f;"></i><span id="hud-gold">200</span>
            </div>
            <div class="hud-item">
                <i class="fa-solid fa-clock" style="color: #94a3b8;"></i>
                <span id="hud-time">0s</span>
            </div>
        </div>
        <div class="controls">
            <button id="btn-home" class="btn-home active" onclick="setTowerType('home')">
                🏠 Property
                <span class="cost-tag">$50</span>
            </button>
            <button id="btn-car" class="btn-car" onclick="setTowerType('car')">
                🚗 Car
                <span class="cost-tag">$40</span>
            </button>
            <button id="btn-medical" class="btn-medical" onclick="setTowerType('medical')">
                🏥 Medical
                <span class="cost-tag">$60</span>
            </button>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="game-over-modal" class="modal-overlay" style="display: none;">
            <div class="login-card">
                <h1 class="logo">Wave Defeated!</h1>
                <p class="user-email" id="game-feedback-text">Session Completed!</p>
                <div class="dash-card" style="box-shadow: none; border: none;">
                    <span class="level-badge">Final Gold (Points)</span>
                    <div id="final-gold" class="stat-value">0</div>
                </div>
                <div class="dash-card" style="box-shadow: none; border: none;">
                    <span class="level-badge">Time Survived</span>
                    <div id="final-time" class="stat-value">0s</div>
                </div>

                <p id="placement-status" style="margin: 10px 0; font-weight: bold;"></p>

                <button onclick="window.location.href='dashboard.html'" class="submit-btn">Back to Home</button>
            </div>
        </div>
        </div>
        </div>
    </main>

    <script src="js/Risk_Defender.js"></script>
    <script src="https://kit.fontawesome.com/9f78b93a41.js" crossorigin="anonymous"></script>

</body>

</html>
