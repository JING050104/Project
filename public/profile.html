<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Coverage Quest</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <a href="dashboard.html" class="logo">Coverage Quest</a>
            <div class="header-profile-box">
                <div class="profile-info">
                    <a href="profile.html" class="profile-trigger">
                        <img id="headerAvatar" src="https://ui-avatars.com/api/?name=User&background=4a90e2&color=fff" alt="Profile">
                    </a>
                    <span id="userNameHeader">User</span>
                    <button id="logoutBtn" class="mini-logout" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="login-card" style="margin: 0 auto; display: block;">
                <div id="resetModal" class="modal-overlay" style="display: none;">
                    <div class="login-card">
                        <span class="close-modal" id="closeResetBtn">&times;</span>
                        <div id="resetStep1">
                            <h2>Reset Password</h2>
                            <p>We will send a code to: <strong id="confirmEmailDisplay"></strong></p> 
                            <input type="hidden" id="resetEmail"> 
                            <button id="resetSendBtn" class="submit-btn">Send Code</button>
                        </div>
                        <div id="resetStep2" style="display: none;">
                            <h2>Reset Password</h2>
                            <p>Enter the 6-digit code sent to your email.</p>
                            <input type="text" id="resetVerifyCode" class="large-code-input" placeholder="6-digit Code" maxlength="6">
                            <button id="resetFinishBtn" class="submit-btn">Update Password</button>
                        </div>
                    </div>
                </div>

                <div class="avatar-section" style="text-align: center;">
                    <div class="avatar-wrapper">
                        <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=4a90e2&color=fff" alt="Profile">
                        <label for="imageUpload" class="camera-icon"><i>📷</i></label>
                        <input type="file" id="imageUpload" accept="image/*" hidden>
                    </div>
                    <h2 id="displayTitle"></h2>
                    <p id="displayEmail" class="user-email"></p>
                </div>

                <hr style="margin: 20px 0;">

                <div class="settings-form-wrapper">
                    <form id="profileUpdateForm">
                        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                            
                            <div class="profile-section-left" style="flex: 1; min-width: 250px;">
                                <h3 style="margin-bottom: 15px; color: #2c3e50;">Profile Information</h3>
                                <div class="input-group">
                                    <label>Username</label>
                                    <input type="text" id="editUsername" placeholder="Username">
                                </div>
                                <div class="input-group">
                                    <label>Email Address</label>
                                    <input type="email" id="editEmail" placeholder="Email">
                                </div>
                            </div>

                            <div class="profile-section-right" style="flex: 1; min-width: 250px;">
                                <h3 style="margin-bottom: 15px; color: #2c3e50;">Change Password</h3>
                                <div class="input-group">
                                    <label>Current Password</label>
                                    <input type="password" id="currPass" placeholder="Enter current password">
                                </div>
                                <p style="text-align: right; font-size: 12px;">
                                    <a href="#" id="forgotPasswordLink" style="color: #4a90e2;">Forgot Password?</a>
                                </p>
                                <div class="password-container">
                                    <label>New Password</label>
                                    <input type="password" id="NewPassword" placeholder="New password">
                                    <span class="toggle-eye" onclick="toggleVisibility('NewPassword')"></span>
                                </div>
                                <div id="regPasswordRequirements" class="requirements-box">
                                    <div id="reg-req-length" class="req-item">× 8+ Characters</div>
                                    <div id="reg-req-upper" class="req-item">× Capital Letter</div>
                                    <div id="reg-req-lower" class="req-item">× Small Letter</div>
                                    <div id="reg-req-num" class="req-item">× Numeric</div>
                                    <div id="reg-req-special" class="req-item">× Special Character</div>
                                </div>
                                <div class="password-container">
                                    <label>Confirm Password</label>
                                    <input type="password" id="regConfirmPassword" placeholder="Confirm new password">
                                    <span class="toggle-eye" onclick="toggleVisibility('regConfirmPassword')"></span>
                                </div>
                            </div>
                        </div>

                        <div style="text-align: center; margin-top: 30px;">
                            <button type="submit" class="submit-btn" style="width: 250px;">Save All Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="js/Profile.js"></script>
</body>
</html>
